<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Syslíci">
<meta name="theme-color" content="#FFF6EE">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="config.js"></script>
</head>
<body>
<title>Syslík</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen phone app. Sticky greeting header, scene card, action grid, floating pill tab bar. Burrow pastels, rounded type. */
:root{
  --bg:#FFF6EE; --bg-2:#FDEBDD; --card:#FFFFFF; --card-2:#FFF0E5; --ink:#4A3934; --ink-soft:#8E7A72;
  --accent:#E8846A; --accent-ink:#FFFFFF; --accent-soft:#FDDDD0; --line:rgba(74,57,52,.09);
  --shadow:0 8px 22px rgba(140,90,60,.10); --shadow-sm:0 3px 10px rgba(140,90,60,.08);
  --font-display:"Baloo 2","Avenir Next Rounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --font-body:"Quicksand","Avenir Next",system-ui,-apple-system,sans-serif;
  --m-energy:#F0C14B; --m-mood:#F08BA6; --m-content:#6FC29A; --m-sleep:#A595E0; --m-curious:#6FAEE6;
  --meadow-1:#C6E6FF; --meadow-2:#FFF3DA; --meadow-g:#9FD69A;
  --forest-1:#D3EEDF; --forest-2:#F3F8E9; --forest-g:#7DBE8B;
  --cave-1:#8E7564; --cave-2:#B89B85; --cave-g:#6E5747; --cave-arch:#C7AE98;
  --beach-1:#BCE4FF; --beach-2:#FFF0D3; --beach-g:#F3DBA9; --sea:#94D6EA;
  --winter-1:#DFE3FF; --winter-2:#FFFFFF; --winter-g:#EEF2FF;
  --den-1:#C9A88C; --den-2:#E6CDB4; --den-in:#F3E1CC; --rug:#F4A9A8;
  --cloud:rgba(255,255,255,.88); --sun-d:inline; --moon-d:none; --star-o:0;
  --bubble-me:#FDDDD0; --bubble-them:#FFFFFF;
  --map-sea:#BFE3F5; --map-land:#F6ECD6; --map-land2:#EDE2C8; --map-cz:#CDE8C3; --map-it:#F3DDB8; --map-ink:#6B5A52; --map-river:#7FC3E6; --night:rgba(0,0,0,0);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E1A23; --bg-2:#2A2330; --card:#2B2633; --card-2:#352E3D; --ink:#F4EDE7; --ink-soft:#B3A7A1;
  --accent:#F0A48B; --accent-ink:#2A1E1A; --accent-soft:#4D3A3B; --line:rgba(255,255,255,.08);
  --shadow:0 8px 22px rgba(0,0,0,.35); --shadow-sm:0 3px 10px rgba(0,0,0,.3);
  --meadow-1:#28325A; --meadow-2:#3B385C; --meadow-g:#3A5A43;
  --forest-1:#21352E; --forest-2:#2D3E36; --forest-g:#2C4733;
  --cave-1:#2A211D; --cave-2:#3A2E28; --cave-g:#241B17; --cave-arch:#3E322B;
  --beach-1:#22355A; --beach-2:#3A3450; --beach-g:#6A583D; --sea:#2C5A76;
  --winter-1:#2B2E4A; --winter-2:#3D405F; --winter-g:#C5CADF;
  --den-1:#2E241F; --den-2:#3D3029; --den-in:#4A3A30; --rug:#B97473;
  --cloud:rgba(255,255,255,.10); --sun-d:none; --moon-d:inline; --star-o:.8;
  --bubble-me:#5A4040; --bubble-them:#2F2A37; color-scheme:dark;
  --map-sea:#22364F; --map-land:#3A3446; --map-land2:#332E3E; --map-cz:#34503D; --map-it:#4A3E38; --map-ink:#CBBFB8; --map-river:#4D86AD; --night:rgba(16,18,48,.32);
}}
:root[data-theme="dark"]{
  --bg:#1E1A23; --bg-2:#2A2330; --card:#2B2633; --card-2:#352E3D; --ink:#F4EDE7; --ink-soft:#B3A7A1;
  --accent:#F0A48B; --accent-ink:#2A1E1A; --accent-soft:#4D3A3B; --line:rgba(255,255,255,.08);
  --shadow:0 8px 22px rgba(0,0,0,.35); --shadow-sm:0 3px 10px rgba(0,0,0,.3);
  --meadow-1:#28325A; --meadow-2:#3B385C; --meadow-g:#3A5A43;
  --forest-1:#21352E; --forest-2:#2D3E36; --forest-g:#2C4733;
  --cave-1:#2A211D; --cave-2:#3A2E28; --cave-g:#241B17; --cave-arch:#3E322B;
  --beach-1:#22355A; --beach-2:#3A3450; --beach-g:#6A583D; --sea:#2C5A76;
  --winter-1:#2B2E4A; --winter-2:#3D405F; --winter-g:#C5CADF;
  --den-1:#2E241F; --den-2:#3D3029; --den-in:#4A3A30; --rug:#B97473;
  --cloud:rgba(255,255,255,.10); --sun-d:none; --moon-d:inline; --star-o:.8;
  --bubble-me:#5A4040; --bubble-them:#2F2A37; color-scheme:dark;
  --map-sea:#22364F; --map-land:#3A3446; --map-land2:#332E3E; --map-cz:#34503D; --map-it:#4A3E38; --map-ink:#CBBFB8; --map-river:#4D86AD; --night:rgba(16,18,48,.32);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,textarea,select{font-size:max(16px,1em)}
button,a,[data-act],[data-tab]{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15.5px;font-weight:600;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink);-webkit-user-select:text;user-select:text}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.15}
.wrap{max-width:560px;margin:0 auto;padding-block:6px 118px;display:flex;flex-direction:column;gap:14px}
body.chatting .wrap{padding-bottom:196px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px 6px;max-width:560px;margin:0 auto}
.top .eyebrow{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft)}
.top h1{font-size:28px;font-weight:800;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sub{font-size:12.5px;color:var(--ink-soft);font-weight:700}
.top .btns{display:flex;gap:8px;flex:none}
.icon-btn{height:42px;min-width:42px;padding:0 12px;border-radius:99px;background:var(--card);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;gap:6px;font-size:17px;font-weight:700}
.icon-btn small{font-size:13px}

/* floating tab bar */
.tabs{position:fixed;z-index:6;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));
  max-width:540px;margin:0 auto;transform:translate3d(0,0,0);-webkit-transform:translate3d(0,0,0);will-change:transform;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:var(--card);border-radius:26px;box-shadow:0 10px 30px rgba(90,50,30,.16);padding:6px;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
body.typing .tabs{visibility:hidden}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 0 5px;border-radius:20px;font-size:10px;font-weight:700;color:var(--ink-soft);transition:background .2s}
.tab .e{font-size:22px;line-height:1.15;filter:grayscale(.6);opacity:.7;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.tab[aria-current="page"]{color:var(--ink);background:var(--accent-soft)}
.tab[aria-current="page"] .e{filter:none;opacity:1;transform:translateY(-2px) scale(1.12)}
.badge{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;line-height:18px;text-align:center}

/* scene */
.scene{position:relative;height:330px;border-radius:32px;overflow:hidden;box-shadow:var(--shadow);isolation:isolate}
.hab{position:absolute;inset:0;background:linear-gradient(var(--h1),var(--h2));z-index:-1;overflow:hidden}
.hab-meadow{--h1:var(--meadow-1);--h2:var(--meadow-2);--hg:var(--meadow-g)}
.hab-forest{--h1:var(--forest-1);--h2:var(--forest-2);--hg:var(--forest-g)}
.hab-cave{--h1:var(--cave-1);--h2:var(--cave-2);--hg:var(--cave-g)}
.hab-beach{--h1:var(--beach-1);--h2:var(--beach-2);--hg:var(--beach-g)}
.hab-winter{--h1:var(--winter-1);--h2:var(--winter-2);--hg:var(--winter-g)}
.hab .hill{position:absolute;left:-25%;width:95%;top:56%;height:60%;border-radius:50%;background:color-mix(in srgb,var(--hg) 70%,var(--h2))}
.hab .hill.r{left:auto;right:-30%;width:85%;top:60%}
.hab .ground{position:absolute;left:-35%;width:170%;top:69%;height:64%;border-radius:50%;background:var(--hg)}
.hab .sea{position:absolute;left:0;right:0;top:52%;height:17%;background:var(--sea)}
.hab .sea::after{content:"";position:absolute;left:0;right:0;top:-4px;height:8px;background:radial-gradient(circle at 8px 8px,var(--sea) 7px,transparent 8px) 0 0/16px 8px repeat-x;animation:wave 3s linear infinite}
.hab .arch{position:absolute;left:5%;right:5%;top:8%;height:110%;border-radius:50%;background:var(--cave-arch);opacity:.7}
.hab .deco{position:absolute;transform:translate(-50%,-50%);line-height:1}
.hab .sun{display:var(--sun-d)} .hab .moon{display:var(--moon-d)}
.hab-cave .sun,.hab-cave .moon,.hab-cave .star,.hab-cave .cloud{display:none}
.hab .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:var(--star-o)}
.cloud{position:absolute;width:86px;height:26px;border-radius:30px;background:var(--cloud);animation:drift 46s linear infinite}
.cloud::before{content:"";position:absolute;width:42px;height:38px;border-radius:50%;background:inherit;left:14px;top:-18px}
.cloud::after{content:"";position:absolute;width:30px;height:28px;border-radius:50%;background:inherit;left:44px;top:-11px}
.cloud.c2{transform:scale(.7);animation-duration:62s;animation-delay:-30s}
.flake{position:absolute;top:-6%;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.9;animation:fall 9s linear infinite}
.leaf{position:absolute;top:-8%;font-size:16px;animation:fall 13s linear infinite}
@keyframes drift{from{left:-30%}to{left:110%}}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(30px,380px) rotate(240deg)}}
@keyframes wave{to{background-position:16px 0}}
.cast{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;align-items:flex-end;gap:6px}
.cast.together .slot + .slot{margin-left:-46px}
.slot{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:margin .6s cubic-bezier(.3,1.4,.5,1)}
.tag{font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(6px);display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:#9AA39C}
.dot.on{background:#4CB27A;box-shadow:0 0 0 3px rgba(76,178,122,.25)}
.bubble{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:84%;background:var(--card);color:var(--ink);font-weight:700;font-size:14.5px;text-align:center;padding:9px 16px;border-radius:20px;box-shadow:var(--shadow);animation:pop .35s cubic-bezier(.3,1.5,.5,1);z-index:2}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:var(--card)}
.chip-float{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:12.5px;font-weight:700;padding:4px 12px;border-radius:99px;background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(6px);white-space:nowrap}
.chip-float.low{top:auto;bottom:10px;left:auto;right:12px;transform:none}
@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.blanket{position:absolute;left:50%;bottom:20px;width:270px;height:52px;margin-left:-135px;border-radius:16px;background:var(--rug);box-shadow:inset 0 0 0 5px color-mix(in srgb,#fff 35%,transparent);display:flex;justify-content:center;align-items:center;gap:6px;font-size:22px;animation:fadeup .5s ease}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}}

/* syslík */
.sy{display:block;overflow:visible}
.sy .fig,.sy .breathe,.sy .headbob,.sy .head,.sy .tailw,.sy .eye,.sy .pawR,.sy .chomp,.sy .zzz,.sy .food{transform-box:fill-box}
.sy .fig{transform-origin:50% 100%;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.sy .breathe{transform-origin:50% 100%;animation:breathe 3.6s ease-in-out infinite}
.sy .headbob{animation:bob 3.6s ease-in-out infinite}
.sy .head{transform-origin:50% 100%;animation:look 11s ease-in-out infinite;transition:transform .5s}
.sy .tailw{transform-origin:12% 96%;animation:wagIdle 7s ease-in-out infinite}
.sy .eye{transform-origin:50% 50%;animation:blink 5.3s infinite}
.sy .pawR{transform-origin:50% 100%}
.pose-happy .fig{animation:hop .5s ease-out 2}
.pose-jump .fig{animation:hop .55s ease-out 3}
.pose-happy .tailw,.pose-petted .tailw,.pose-jump .tailw,.pose-cuddle-l .tailw,.pose-cuddle-r .tailw,.pose-dance .tailw,.pose-love .tailw{animation:wag .26s ease-in-out infinite}
.pose-petted .head{animation:none;transform:rotate(8deg)}
.pose-petted .fig{transform:scale(1.03,.97)}
.pose-dance .fig{animation:dance .9s ease-in-out infinite}
.pose-wave .pawR{animation:wavepaw .55s ease-in-out infinite}
.pose-cuddle-r .fig{transform:rotate(9deg)}
.pose-cuddle-l .fig{transform:rotate(-9deg)}
.pose-cuddle-r .head{animation:none;transform:rotate(7deg)}
.pose-cuddle-l .head{animation:none;transform:rotate(-7deg)}
.pose-eat .chomp{transform-origin:50% 50%;animation:chomp .34s infinite}
.pose-eat .food{animation:nibble .34s infinite}
.pose-drink .head{animation:nod .84s ease-in-out infinite}
.pose-sleep .head{animation:none;transform:rotate(-7deg)}
.pose-sleep .zzz{animation:zzz 2.6s ease-in-out infinite}
.pose-sleep .breathe{animation-duration:5s}
.pose-yawn .head{animation:none;transform:rotate(-6deg)}
.sy.still *{animation:none!important}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.03)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes look{0%,38%,100%{transform:rotate(0)}43%,52%{transform:rotate(-8deg)}57%,78%{transform:rotate(0)}83%,90%{transform:rotate(7deg)}95%{transform:rotate(0)}}
@keyframes wagIdle{0%,68%,100%{transform:rotate(0)}72%{transform:rotate(9deg)}76%{transform:rotate(-7deg)}80%{transform:rotate(9deg)}84%{transform:rotate(0)}}
@keyframes wag{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(14deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.1)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-28px)}70%{transform:translateY(0) scale(1.04,.96)}}
@keyframes dance{0%,100%{transform:rotate(-9deg) translateY(0)}25%{transform:rotate(0) translateY(-14px)}50%{transform:rotate(9deg) translateY(0)}75%{transform:rotate(0) translateY(-14px)}}
@keyframes wavepaw{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(26deg)}}
@keyframes chomp{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1.4)}}
@keyframes nibble{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes nod{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(6deg) translateY(5px)}}
@keyframes zzz{0%,100%{opacity:.25;transform:translateY(6px)}50%{opacity:1;transform:translateY(-6px)}}

/* moods */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.mood{background:var(--card);border-radius:16px;padding:8px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow-sm)}
.mood .e{font-size:17px;line-height:1}
.bar{width:100%;height:7px;border-radius:9px;background:var(--card-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--c);transition:width .6s}
.mood small{font-size:10px;font-weight:700;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* actions */
.grid{display:grid;gap:10px}
.todo{display:flex;flex-direction:column;gap:8px}
.todo-it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--card);box-shadow:0 1px 0 rgba(0,0,0,.04),0 4px 14px -8px rgba(0,0,0,.18)}
.todo-it .todo-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.todo-it .todo-tx b{font-weight:700;overflow-wrap:anywhere}
.todo-it.done .todo-tx b{text-decoration:line-through;opacity:.55}
.todo-ck{flex:none;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--accent);background:transparent;color:var(--accent-ink);font-weight:800;font-size:16px;display:grid;place-items:center;cursor:pointer}
.todo-ck[aria-pressed="true"]{background:var(--accent)}
.todo-it .x{flex:none}
.todo-n{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:800;margin-left:2px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.act{background:var(--card);border-radius:20px;padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow-sm);font-size:12.5px;font-weight:700;transition:transform .15s}
.act .e{font-size:28px;line-height:1.15}
.act:active,.pick:active,.chip:active,.swatch:active,.cloth:active{transform:scale(.93)}
.act.hl{background:var(--accent-soft)}

.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow-sm)}
.muted{color:var(--ink-soft)}
.small{font-size:13.5px}
.center{text-align:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 18px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;font-family:var(--font-display);transition:transform .15s,opacity .2s;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card-2);color:var(--ink);box-shadow:none}
.btn.danger{background:none;color:#D0634F;font-size:15px;padding:8px;box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.label{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft)}

/* sheets */
.backdrop{position:fixed;inset:0;z-index:20;background:rgba(40,25,20,.38);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:560px;max-height:90%;overflow:auto;background:var(--bg);border-radius:30px 30px 0 0;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  animation:slide .32s cubic-bezier(.2,1.1,.4,1);display:flex;flex-direction:column;gap:14px}
.sheet.full{max-height:100%;height:100%;border-radius:0;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 2px;flex:none}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h2{font-size:24px}
.x{width:36px;height:36px;border-radius:50%;background:var(--card);font-size:16px;flex:none;box-shadow:var(--shadow-sm)}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateY(100%)}}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pick{background:var(--card);border-radius:22px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:14px;box-shadow:var(--shadow-sm);transition:transform .15s}
.pick .e{font-size:40px;line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:99px;background:var(--card);font-weight:700;font-size:14px;box-shadow:var(--shadow-sm);border:2px solid transparent;transition:transform .15s}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatch{width:42px;height:42px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1),var(--shadow-sm);border:3px solid var(--bg);outline:3px solid transparent;transition:transform .15s}
.swatch[aria-pressed="true"]{outline-color:var(--accent)}
textarea,input[type=text]{width:100%;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 15px;font-size:16px;resize:none}
textarea:focus,input[type=text]:focus{border-color:var(--accent);outline:none}
.counter{font-size:12px;text-align:right;margin-top:-8px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card-2);border-radius:99px;padding:4px}
.seg button{padding:9px;border-radius:99px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:var(--shadow-sm)}
.preview{display:flex;justify-content:center;background:radial-gradient(circle at 50% 70%,var(--accent-soft),transparent 70%);border-radius:28px;padding-top:6px}

/* wardrobe */
.rail{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.cloth{position:relative;flex:none;width:92px;background:var(--card);border-radius:20px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow-sm);border:2px solid transparent;transition:transform .15s}
.cloth[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.cloth small{font-size:11px;font-weight:700;line-height:1.2;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cloth .more{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:var(--card-2);font-size:13px;line-height:24px}
.cloth.new{justify-content:center;border:2px dashed var(--line);background:none;box-shadow:none;color:var(--ink-soft)}
.cloth.new .e{font-size:26px}

/* chat */
.day{align-self:center;font-size:11.5px;font-weight:700;color:var(--ink-soft);background:var(--card-2);padding:3px 12px;border-radius:99px;margin-top:4px}
.msg{max-width:80%;padding:9px 13px;border-radius:20px 20px 20px 6px;background:var(--bubble-them);box-shadow:var(--shadow-sm);font-size:15px;align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.msg.me{align-self:flex-end;background:var(--bubble-me);border-radius:20px 20px 6px 20px}
.msg small{display:block;font-size:10.5px;color:var(--ink-soft);font-weight:700;margin-top:2px}
.msg.new{box-shadow:0 0 0 2px var(--accent),var(--shadow-sm)}
.msg.sticker{background:none;box-shadow:none;padding:0;text-align:center}
.msg.sticker b{display:block;font-family:var(--font-display);font-size:15px;margin-top:-6px}
.seen{align-self:flex-end;font-size:11px;font-weight:700;color:var(--ink-soft);margin-top:-8px}
.typing{align-self:flex-start;font-size:13px;color:var(--ink-soft);font-weight:700;padding:6px 12px;border-radius:99px;background:var(--card-2)}
.typing i{display:inline-block;width:5px;height:5px;margin-left:3px;border-radius:50%;background:var(--ink-soft);animation:tdot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,100%{opacity:.25}50%{opacity:1}}
.composer{position:fixed;z-index:6;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.composer .bar2{display:flex;gap:8px;align-items:flex-end;background:var(--card);border-radius:24px;padding:6px;box-shadow:0 8px 24px rgba(90,50,30,.14)}
.composer textarea{border:0;background:none;padding:9px 6px;max-height:110px;min-height:40px}
.composer textarea:focus{border:0}
.round{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--card-2)}
.round.send{background:var(--accent);color:var(--accent-ink);font-size:17px}
.round.send[disabled]{opacity:.4}
.stickers{display:flex;gap:6px;overflow-x:auto;background:var(--card);border-radius:22px;padding:8px;box-shadow:0 8px 24px rgba(90,50,30,.14);scrollbar-width:none}
.stickers button{flex:none;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700;padding:2px 4px;border-radius:14px}
.stickers button:active{background:var(--card-2)}

/* lists */
.mem{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.mem .ic{width:52px;height:52px;flex:none;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:27px}
.mem .tx{min-width:0;flex:1}
.mem b{font-family:var(--font-display);font-weight:700;font-size:17px;display:block;line-height:1.2}
.mem span{display:block;font-size:13.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mem time{font-size:11.5px;color:var(--ink-soft);font-weight:700}
.dmood{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dmood .card{padding:11px 13px;min-width:0}
.dmood .e{font-size:24px;line-height:1}
.pmsg{max-width:82%;padding:10px 13px;border-radius:18px;background:var(--card);box-shadow:var(--shadow-sm);font-size:14px}
.pmsg.me{align-self:flex-end;background:var(--accent-soft)}
.pmsg small{display:block;font-size:10.5px;color:var(--ink-soft);font-weight:700;margin-top:2px}

/* den */
.den{position:relative;height:300px;border-radius:32px;overflow:hidden;background:linear-gradient(var(--den-1),var(--den-2));box-shadow:var(--shadow)}
.den .inner{position:absolute;left:7%;right:7%;top:10%;height:110%;border-radius:50%;background:var(--den-in)}
.den .rug{position:absolute;left:22%;right:22%;bottom:14px;height:44px;border-radius:50%;background:var(--rug);opacity:.85}
.den .it{position:absolute;transform:translate(-50%,-50%);font-size:36px;line-height:1;cursor:pointer;animation:fadeup .4s}
.den .fixed{position:absolute;transform:translate(-50%,-50%);line-height:1}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:9px}
.inv button{background:var(--card);border-radius:18px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow-sm)}
.inv .e{font-size:30px}
.inv small{font-size:10.5px;font-weight:700;color:var(--ink-soft);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}

/* hide and seek */
.hs{position:relative;flex:1;min-height:420px;border-radius:30px;overflow:hidden}
.hs .spot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer}
.hs .bush{font-size:88px;line-height:1;display:inline-block;transform-origin:50% 100%}
.hs .bush.wig{animation:wig .35s}
.hs .peek{position:absolute;left:70%;top:20%;width:14px;height:36px;border-radius:9px;transform:rotate(30deg)}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(9deg)}75%{transform:rotate(-8deg)}}
.hs .found{animation:rise .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes rise{from{transform:translateY(40px) scale(.4);opacity:0}}

/* fx + toast */
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.fx{position:absolute;font-size:28px;animation:float 1.7s ease-out forwards}
@keyframes float{from{transform:translate(0,0) scale(var(--s));opacity:1}to{transform:translate(var(--dx),-170px) scale(var(--s));opacity:0}}
#toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;background:var(--card);color:var(--ink);font-weight:700;font-size:14.5px;padding:11px 18px;border-radius:99px;box-shadow:0 10px 28px rgba(0,0,0,.18);max-width:calc(100% - 32px);text-align:center;animation:drop .4s cubic-bezier(.3,1.4,.5,1)}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}
.loading{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.steps{display:flex;gap:7px;justify-content:center}
.steps i{width:8px;height:8px;border-radius:9px;background:var(--accent-soft);transition:width .3s}
.steps i.on{background:var(--accent)} .steps i.cur{width:26px}
.ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* cestování: místa */
.chip-float{z-index:3}
.chip-float.low.left{right:auto;left:12px;cursor:pointer;color:var(--ink)}
.place{position:absolute;inset:0;z-index:-1;overflow:hidden}
.fw{position:fixed;z-index:3000;width:10px;height:10px;margin:-5px;border-radius:50%;pointer-events:none;animation:fw 1.4s cubic-bezier(.2,.7,.3,1) forwards;box-shadow:0 0 6px currentColor}
@keyframes fw{0%{transform:translate(0,0) scale(1);opacity:1}80%{opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 30px)) scale(.4);opacity:0}}
.bigmsg{position:fixed;left:50%;top:38%;z-index:3001;transform:translate(-50%,-50%);background:var(--card);color:var(--ink);font-family:var(--font-display);font-size:24px;font-weight:800;padding:14px 22px;border-radius:22px;box-shadow:var(--shadow);white-space:nowrap;animation:bigpop 2.6s ease forwards;pointer-events:none}
@keyframes bigpop{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}12%{transform:translate(-50%,-50%) scale(1.08);opacity:1}20%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0}}
.plushrow{position:absolute;left:3%;right:3%;bottom:26%;z-index:3;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.plushrow .pg{display:flex;align-items:flex-end;gap:0}
.plush{pointer-events:auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18));animation:plushbob 3.2s ease-in-out infinite}
.plush:nth-child(2){animation-delay:-1s}.plush:nth-child(3){animation-delay:-2s}
.plush.party{animation:plushparty .5s ease-in-out infinite}
@keyframes plushbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes plushparty{0%,100%{transform:translateY(0) rotate(-10deg)}50%{transform:translateY(-8px) rotate(10deg)}}
.plushsay{position:absolute;left:50%;transform:translateX(-50%);bottom:5%;z-index:4;width:max-content;max-width:78%;text-align:center;background:var(--card);color:var(--ink);border-radius:14px;padding:6px 10px;font-size:12px;font-weight:700;box-shadow:var(--shadow-sm)}
.gfurn{position:absolute;left:0;right:0;bottom:0;width:100%;height:100%;pointer-events:none;z-index:0}
.place .deco{position:absolute;transform:translate(-50%,-50%);line-height:1}
.night{position:absolute;inset:0;background:var(--night);pointer-events:none}
.skdoor{position:absolute;left:6%;top:50%;width:56px;height:66px;border-radius:28px 28px 4px 4px;background:#8A5A3C;border:4px solid #6B4430;box-shadow:inset 0 -10px 0 rgba(0,0,0,.12)}
.skdoor::before{content:"";position:absolute;left:50%;top:12px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#F7D98B;box-shadow:0 0 10px #F7D98B}
.skdoor i{position:absolute;right:8px;top:36px;width:6px;height:6px;border-radius:50%;background:#F2D16B}
.skdoor::after{content:"Sklípek";position:absolute;left:50%;top:-22px;transform:translateX(-50%);font:700 11px var(--font-display);color:#6B4430;background:#FFF3DA;padding:0 7px;border-radius:6px;white-space:nowrap}
.pl-cph{background:linear-gradient(#BFE1FA,#EAF4FB)}
.houses{position:absolute;left:-2%;right:-2%;top:10%;height:38%;display:flex;align-items:flex-end}
.fquay{position:absolute;left:0;right:0;top:47%;height:5.5%;background:repeating-linear-gradient(90deg,#CDBDAA 0 22px,#BCA996 22px 24px);box-shadow:0 3px 0 #A8957F}
.houses i{flex:1;height:100%;background:var(--c);clip-path:polygon(0 16%,50% 0,100% 16%,100% 100%,0 100%);position:relative}
.houses i:nth-child(odd){height:84%}
.houses i::after{content:"";position:absolute;left:20%;right:20%;top:28%;bottom:14%;background:repeating-linear-gradient(90deg,rgba(255,250,235,.9) 0 6px,transparent 6px 12px);-webkit-mask:repeating-linear-gradient(#000 0 8px,transparent 8px 16px);mask:repeating-linear-gradient(#000 0 8px,transparent 8px 16px)}
.canal{position:absolute;left:0;right:0;top:52.5%;height:13.5%;background:linear-gradient(#6FB3D9,#5A9FC8)}
.boat{position:absolute;top:-16px;font-size:26px;animation:sail 34s linear infinite}
@keyframes sail{from{left:-12%}to{left:108%}}
.quay{position:absolute;left:0;right:0;top:66%;bottom:0;background:repeating-linear-gradient(90deg,#CDBDAA 0 22px,#BCA996 22px 24px)}
.pl-hangar{background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 2px,transparent 2px 38px),linear-gradient(#5E6B7C,#8A97A8)}
.hg-door{position:absolute;left:7%;right:7%;top:8%;height:58%;border-radius:48% 48% 0 0/36% 36% 0 0;background:linear-gradient(#BFE1FA,#E8F2FB);border:6px solid #47505F;border-bottom:0}
.plane{position:absolute;left:8%;width:84%;top:30%}
.hg-floor{position:absolute;left:0;right:0;top:66%;bottom:0;background:#B5BCC6}
.hg-floor::after{content:"";position:absolute;left:0;right:0;top:34%;height:5px;background:repeating-linear-gradient(90deg,#F2C94C 0 26px,transparent 26px 44px)}
.sign{position:absolute;left:50%;top:3%;transform:translateX(-50%);font:800 12px var(--font-display);letter-spacing:.25em;color:#E9EEF4;background:#2F3846;padding:2px 10px;border-radius:6px}
.pl-theatre{background:#2A1A2E}
.spot{position:absolute;left:15%;right:15%;top:0;bottom:12%;background:radial-gradient(ellipse at 50% 100%,rgba(255,236,190,.6),transparent 66%)}
.stage{position:absolute;left:0;right:0;top:72%;bottom:0;background:linear-gradient(#8A5A3C,#5E3B29)}
.crowd{position:absolute;left:0;right:0;bottom:0;height:12%;background:radial-gradient(circle at 16px 26px,#1B1220 13px,transparent 14px) 0 0/32px 32px repeat-x;opacity:.9}
.curtain{position:absolute;top:0;bottom:0;width:20%;background:repeating-linear-gradient(90deg,#9E2238 0 9px,#C2334C 9px 18px);box-shadow:inset -8px 0 18px rgba(0,0,0,.3)}
.curtain.l{left:0;border-bottom-right-radius:70% 30%}
.curtain.r{right:0;border-bottom-left-radius:70% 30%}
.valance{position:absolute;left:0;right:0;top:0;height:13%;background:linear-gradient(#E6B94F,#C99A33);border-bottom:4px solid #A87D25;display:grid;place-items:center;font:800 11px var(--font-display);letter-spacing:.3em;color:#5E3B12}
.pl-mill{background:linear-gradient(#C9E5F7,#F4F1E1)}
.hills{position:absolute;left:-10%;right:-10%;top:28%;height:40%;background:radial-gradient(ellipse at 22% 100%,#4F8A5B 0 62%,transparent 63%),radial-gradient(ellipse at 78% 100%,#3E7A4C 0 56%,transparent 57%)}
.mill{position:absolute;right:5%;top:30%;width:30%;height:34%}
.mill .roof{position:absolute;left:-8%;right:-8%;top:0;height:42%;background:#8B4A36;clip-path:polygon(50% 0,100% 100%,0 100%)}
.mill .wall{position:absolute;left:0;right:0;top:40%;bottom:0;background:#EFE3CF;border:3px solid #CDBBA0}
.mill .wall i{position:absolute;left:40%;top:30%;width:20%;height:40%;background:#7A5638;border-radius:6px 6px 0 0}
.wheel{position:absolute;left:-34%;bottom:-24%;width:62%;aspect-ratio:1;border-radius:50%;border:5px solid #7A5638;background:repeating-conic-gradient(#7A5638 0 7deg,transparent 7deg 45deg);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bay{position:absolute;left:0;right:0;top:62%;bottom:0;background:linear-gradient(#5FB1B8,#3E8F98)}
.bay::before{content:"";position:absolute;left:0;right:0;top:-4px;height:8px;background:radial-gradient(circle at 8px 8px,#5FB1B8 7px,transparent 8px) 0 0/16px 8px repeat-x;animation:wave 3s linear infinite}
.pier{position:absolute;left:14%;right:14%;bottom:0;height:17%;background:repeating-linear-gradient(90deg,#B98A5A 0 18px,#A57849 18px 20px);border-radius:8px 8px 0 0}
.wfront{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(rgba(95,177,184,.88),rgba(62,143,152,.96));z-index:2}
.wfront::before{content:"";position:absolute;left:0;right:0;top:-4px;height:8px;background:radial-gradient(circle at 8px 8px,rgba(95,177,184,.88) 7px,transparent 8px) 0 0/16px 8px repeat-x;animation:wave 3s linear infinite}
.pl-cellar{background:radial-gradient(ellipse at 50% 30%,#F6DEBB,#C49B74)}
.vault{position:absolute;left:4%;right:4%;top:6%;bottom:-4%;border-radius:50% 50% 0 0/34% 34% 0 0;border:10px solid #9E7B5B;border-bottom:0;background:repeating-linear-gradient(0deg,transparent 0 22px,rgba(120,80,50,.12) 22px 24px)}
.lamp{position:absolute;left:50%;top:6%;width:200px;height:200px;margin-left:-100px;background:radial-gradient(circle,rgba(255,226,150,.55),transparent 65%)}
.hearth{position:absolute;left:9%;bottom:18%;width:74px;height:64px;border-radius:37px 37px 0 0;background:#5A3E2B;border:5px solid #8C6A4F;display:grid;place-items:end center;font-size:30px;padding-bottom:4px}
.flame{display:inline-block;animation:flicker 1.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes flicker{0%,100%{transform:scale(1)}50%{transform:scale(1.12,.92)}}
.shelf{position:absolute;right:8%;top:28%;padding:2px 8px 4px;font-size:18px;border-bottom:5px solid #8C6A4F}
.sofa{position:absolute;left:16%;right:16%;bottom:6%;height:26%;background:#E59A86;border-radius:26px 26px 12px 12px;box-shadow:inset 0 -18px 0 #D3826D}
.trip{position:relative;flex:1;min-height:70vh;border-radius:30px;overflow:hidden;background:linear-gradient(var(--meadow-1),var(--meadow-2))}
.ride{position:absolute;top:36%;left:-70%;display:flex;align-items:flex-end;animation:ride 3s cubic-bezier(.45,0,.55,1) forwards}
.ride .veh{font-size:72px;line-height:1;display:inline-block}
.ride .veh.flip{transform:scaleX(-1)}
@keyframes ride{to{left:110%}}
.trip-t{position:absolute;left:0;right:0;bottom:16%;text-align:center;font-size:26px}
.map{display:block;width:100%;height:auto;border-radius:20px}
.mlabel{fill:var(--map-ink);font-weight:700;letter-spacing:.2em;opacity:.55;font-family:var(--font-body)}
.mname{fill:var(--map-ink);font-size:11.5px;font-weight:700;font-family:var(--font-body)}
.dests{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dest{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;transition:transform .15s}
.dest:active{transform:scale(.96)}
.dest .e{font-size:30px;line-height:1.2}
.dest b{font-family:var(--font-display);font-size:17px;line-height:1.15}
.dest small{font-size:12px}
.dest .here{color:var(--accent);font-weight:700}

/* v4: činnosti */
.sy [class]{transform-box:fill-box}
.sy .strum{transform-origin:50% 0;animation:strum .4s ease-in-out infinite}
@keyframes strum{0%,100%{transform:translateY(-3px) rotate(-6deg)}50%{transform:translateY(4px) rotate(6deg)}}
.sy .bagL,.sy .bagR,.sy .tool,.sy .stroke,.sy .bobber,.sy .sip,.sy .can,.sy .spoon,.sy .clapL,.sy .clapR,.sy .bouq{transform-origin:50% 0}
.sy .twinkle{transform-origin:50% 50%;animation:twinkle 1.8s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.4);opacity:.2}50%{transform:scale(1.1);opacity:1}}
.pose-walk .fig{animation:walk .7s ease-in-out infinite}
@keyframes walk{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.pose-walk .footL,.pose-run .footL{transform-origin:50% 50%;animation:stepL .7s ease-in-out infinite}
.pose-walk .footR,.pose-run .footR{transform-origin:50% 50%;animation:stepR .7s ease-in-out infinite}
@keyframes stepL{0%,100%{transform:translate(-4px,0)}50%{transform:translate(6px,-6px)}}
@keyframes stepR{0%,100%{transform:translate(4px,-6px)}50%{transform:translate(-6px,0)}}
.act-shop .bagL{animation:swing .7s ease-in-out infinite}
.act-shop .bagR{animation:swing .7s ease-in-out infinite reverse}
@keyframes swing{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}

body{background:
  radial-gradient(900px 500px at 110% -10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 60%),
  radial-gradient(700px 500px at -20% 40%,color-mix(in srgb,var(--m-content) 12%,transparent),transparent 60%),
  radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--ink) 7%,transparent) 1px,transparent 1.5px) 0 0/22px 22px,
  var(--bg)}
.top{background:color-mix(in srgb,var(--bg) 86%,transparent);box-shadow:0 0 0 100vmax color-mix(in srgb,var(--bg) 86%,transparent);clip-path:inset(0 -100vmax);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.paused *, .paused *::before, .paused *::after{animation-play-state:paused!important}
body::before{background:color-mix(in srgb,var(--bg) 82%,transparent)}
.top h1{background:linear-gradient(90deg,var(--ink),color-mix(in srgb,var(--accent) 70%,var(--ink)));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:2px}
.card,.act,.mood,.pick,.chip,.cloth,.inv button,.icon-btn{border:1px solid var(--line)}
.card{box-shadow:0 1px 0 rgba(255,255,255,.6) inset,var(--shadow-sm)}

function applyReactions(){
  const p = me(), o = partner(); if (!p || !o) return 0;
  if (p.reactAt === undefined) { updateMe(pp => { pp.reactAt = now(); }); return 0; }
  const since = p.reactAt;
  const list = S.events.filter(e => e.type === "reaction" && e.author === other(S.slot) && e.at > since && e.payload && REACT_MOOD[e.payload.text] !== undefined);
  if (!list.length) return 0;
  const delta = list.reduce((a, e) => a + REACT_MOOD[e.payload.text], 0), last = Math.max(...list.map(e => e.at));
  const m = moods(p);
  updateMe(pp => { pp.energy = m.energy; pp.mood = Math.max(0, Math.min(100, m.mood + delta)); pp.moodSetAt = now(); pp.reactAt = last; });
  return delta;
}

const FLOOR = 40, GENTLE = 55;
const clamp = (v, lo = FLOOR) => Math.min(100, Math.max(lo, v));
const TIRING = new Set(["ballet","practice","ramp","hangar","engineering","cphswim","gswim","pswim","swim","run","bike","trail","prun","pbike","jetski"]);
/* Náročná činnost postupně vezme až 75 % energie (za ~30 minut). */
function tiredDrain(p, t){
  const s = ["a","b"].find(x => S.players[x] === p); if (!s) return 0;
  const l = locationOf(s); if (!l || !l.explicit || l.date || !TIRING.has(l.act)) return 0;
  const from = Math.max(l.at || 0, p.moodSetAt || 0, p.drainAt || 0); return Math.min(75, Math.max(0, (t - from) / 18e5 * 75));
}
function moods(p, t = now()){
  const r = moodsBase(p, t), d = tiredDrain(p, t); if (d) r.energy = clamp(r.energy - d, 0); return r;
}
function moodsBase(p, t = now()){
  const h = Math.max(0, (t - (p.lastInteractionAt || t)) / 36e5);
  if (p.moodSetAt) return { energy:clamp(p.energy, 0), mood:clamp(p.mood, 0), contentment:clamp(p.contentment, 0), sleep:clamp(p.sleep + h*4), curiosity:clamp(p.curiosity + h*2) };
  return { energy:clamp(p.energy + h*3), mood:clamp(p.mood - h*1.5, GENTLE), contentment:clamp(p.contentment - h, GENTLE),
           sleep:clamp(p.sleep + h*4), curiosity:clamp(p.curiosity + h*2) };
}

/* ============ Webová verze: Supabase místo úložiště Claude ============ */
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function supaConnect(){
  const cfg = window.SYSLIK_SUPABASE; if (!cfg || !cfg.url || !cfg.key) return null;
  if (!window.supabase || !window.supabase.createClient) await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js");
  const sb = window.supabase.createClient(cfg.url, cfg.key, {auth:{persistSession:false}});
  const cache = {}, subs = {}, loaded = {};
  const mapOf = c => cache[c] || (cache[c] = new Map());
  function snapFor(c, sub){
    let docs = [...mapOf(c).entries()].map(([id, data]) => ({id, exists:true, data:() => data}));
    if (sub.order) { const [f, dir] = sub.order; docs.sort((a, b) => (dir === "desc" ? -1 : 1) * (((a.data() || {})[f] || 0) - ((b.data() || {})[f] || 0))); }
    if (sub.limit) docs = docs.slice(0, sub.limit);
    const changes = docs.filter(d => !sub.seen.has(d.id)).map(d => ({type:"added", doc:d}));
    docs.forEach(d => sub.seen.add(d.id));
    return {docs, metadata:{fromCache:false}, docChanges:() => changes};
  }
  const notify = c => (subs[c] || []).forEach(sub => { try { sub.cb(snapFor(c, sub)); } catch(e) { console.error(e); } });
  async function load(c){
    if (loaded[c]) return loaded[c];
    loaded[c] = (async () => {
      const {data, error} = await sb.from("docs").select("id,data").eq("collection", c).order("updated_at", {ascending:false}).limit(2000);
      if (error) throw error;
      (data || []).forEach(r => mapOf(c).set(r.id, r.data));
    })();
    return loaded[c];
  }
  sb.channel("docs-changes").on("postgres_changes", {event:"*", schema:"public", table:"docs"}, ch => {
    const r = ch.new && ch.new.collection ? ch.new : ch.old; if (!r || !r.collection) return;
    if (ch.eventType === "DELETE") mapOf(r.collection).delete(r.id); else mapOf(r.collection).set(r.id, ch.new.data);
    notify(r.collection);
  }).subscribe();
  const query = (c, order, limit) => ({
    orderBy:(f, dir) => query(c, [f, dir || "asc"], limit),
    limit:n => query(c, order, n),
    onSnapshot(cb, err){ const sub = {cb, order, limit, seen:new Set()}; (subs[c] || (subs[c] = [])).push(sub);
      load(c).then(() => cb(snapFor(c, sub))).catch(e => err && err(e)); return () => {}; }
  });
  const db = {
    collection:c => query(c, null, null),
    doc(path){ const [c, id] = path.split("/"); return {
      async set(data){ mapOf(c).set(id, clone(data)); notify(c);
        const {error} = await sb.from("docs").upsert({collection:c, id, data, updated_at:new Date().toISOString()}); if (error) throw error; },
      async delete(){ mapOf(c).delete(id); notify(c);
        const {error} = await sb.from("docs").delete().eq("collection", c).eq("id", id); if (error) throw error; }
    }; }
  };
  /* přítomnost (online / píše) přes Realtime presence */
  const rch = sb.channel("room", {config:{presence:{key:uid()}}});
  let state = {}, peersCb = null, ready = false;
  rch.on("presence", {event:"sync"}, () => { const st = rch.presenceState(); const peers = Object.values(st).flat().map(p => ({presence:p})); if (peersCb) peersCb({peers}); });
  rch.subscribe(async status => { if (status === "SUBSCRIBED") { ready = true; try { await rch.track(state); } catch(e) {} } });
  const room = { presence(obj){ state = Object.assign({}, state, obj); return ready ? rch.track(state) : Promise.resolve(); }, onPeers(cb){ peersCb = cb; } };
  return {db, room};
}

/* ============ Úložiště: sdílená databáze, nebo jen tento telefon ============ */
const B = {
  db:null, room:null, downloads:null, writing:false, again:false, pendingMe:false, saveT:null, typingNow:false, typingT:null,
  async init(){
    const api = window.claude;
    let db = null;
    if (api && typeof api.use === "function") { try { db = await api.use("db"); } catch(e) { db = null; } }
    if (!db && window.SYSLIK_SUPABASE) {
      try { const sc = await supaConnect(); if (sc) { this.db = sc.db; S.mode = "cloud"; this.subscribe(); this.room = sc.room; this.setupRoom(); return; } }
      catch(e) { console.error(e); S.netNote = "Nepodařilo se připojit k databázi, ukládám jen do tohoto telefonu."; }
    }
    if (db) {
      this.db = db; S.mode = "cloud"; this.subscribe();
      api.use("room").then(r => { if (r) { this.room = r; this.setupRoom(); } }).catch(() => {});
    } else {
      S.mode = "local"; this.loadLocal(); boot();
    }
    if (api && typeof api.use === "function") api.use("downloads").then(d => { this.downloads = d; }).catch(() => {});
  },
  subscribe(){
    let settled = false;
    const timer = setTimeout(() => { if (!settled) { S.netNote = "Data se zatím nedaří načíst. Zkouším to dál…"; if (!S.booted) boot(); else render(); } }, 10000);
    this.db.collection("players").onSnapshot(snap => {
      const p = {a:null, b:null};
      snap.docs.forEach(d => { if (d.exists && (d.id === "a" || d.id === "b")) p[d.id] = clone(d.data()); });
      if (S.slot && this.pendingMe && S.players[S.slot]) p[S.slot] = S.players[S.slot];
      S.players = p;
      if (!snap.metadata.fromCache && !settled) { settled = true; clearTimeout(timer); S.netNote = null; }
      if (!S.booted) { if (settled) boot(); } else render();
    }, () => { clearTimeout(timer); S.netNote = "Spojení se přerušilo. Zavři a znovu otevři stránku."; if (!S.booted) boot(); else render(); });

    this.db.collection("events").orderBy("at", "desc").limit(1000).onSnapshot(snap => {
      S.events = snap.docs.map(d => Object.assign({id:d.id}, d.data())).reverse();
      snap.docChanges().forEach(ch => { if (ch.type === "added") onEventAdded(Object.assign({id:ch.doc.id}, ch.doc.data())); });
      render();
    }, () => {});

    this.db.collection("den").onSnapshot(snap => {
      S.den = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
      render();
    }, () => {});

    this.db.collection("chat").orderBy("at", "desc").limit(300).onSnapshot(snap => {
      const before = S.chat.length;
      S.chat = snap.docs.map(d => Object.assign({id:d.id}, d.data())).reverse();
      snap.docChanges().forEach(ch => { if (ch.type === "added") onChatAdded(Object.assign({id:ch.doc.id}, ch.doc.data())); });
      render();
      if (S.tab === "chat" && S.chat.length !== before) { scrollChat(); markChatRead(); }
    }, () => {});
  },
  setupRoom(){
    const r = this.room;
    this.announce();
    r.onPeers(ch => {
      const on = {a:false, b:false}; let typing = false;
      ch.peers.forEach(pe => {
        const pr = pe.presence || {}, s = pr.slot;
        if (s === "a" || s === "b") on[s] = true;
        if (S.slot && s === other(S.slot) && pr.typing) typing = true;
      });

    }, () => { S.roomLive = false; render(); });
  },
  announce(){ if (this.room && S.slot) this.room.presence({slot:S.slot, typing:false}).catch(() => {}); },
  setTyping(on){
    if (!this.room || !S.slot) return;
    clearTimeout(this.typingT);

    if (on === this.typingNow) return;

  },
  loadLocal(){
    try {
      const d = JSON.parse(ls.get("syslik.local") || "null");

    } catch(e) {}
    if (!S.slot && S.players.a) S.slot = "a";
  },
  saveLocal(){ ls.set("syslik.local", JSON.stringify({players:S.players, events:S.events.slice(-500), den:S.den, chat:S.chat.slice(-300)})); },
  savePlayer(immediate){

    clearTimeout(this.saveT);
    this.saveT = setTimeout(() => this.flushPlayer(), immediate ? 0 : 600);
  },

    catch(e) { writeError(e); }

function todoList(){
  const st = {};
  S.events.forEach(e => { const p = e.payload || {};
    if (e.type === "todoAdd" && p.text) st[e.id] = {id:e.id, text:p.text, by:p.name, author:e.author, at:e.at, done:false};
    else if (e.type === "todoDone" && st[p.ref]) { st[p.ref].done = !!p.done; st[p.ref].doneBy = p.name; }
    else if (e.type === "todoDel") (p.refs || [p.ref]).forEach(r => { delete st[r]; });
  });
  const l = Object.values(st);

  switch (e.type) {
    case "visit": return `${n} k tobě ${g("přišel","přišla")} na návštěvu! 🏡`;
    case "dateInvite": return DATES[p.kind] ? `${n} tě zve na rande: ${DATES[p.kind].n} ${DATES[p.kind].e}` : null;

let dsCache = {k:null, v:null};
function dateState(){
  const ck = S.events.length + ":" + (S.slot || "") + ":" + Math.floor(now() / 60000);
  if (dsCache.k === ck) return dsCache.v;
  const inv = S.events.filter(e => e.type === "dateInvite" && e.payload && DATES[e.payload.kind]);
  const ans = S.events.filter(e => e.type === "dateAnswer" && e.payload);
  const answered = id => ans.some(a => a.payload.id === id);
  const fresh = e => now() - e.at < 3 * 864e5;
  const pendingIn = [...inv].reverse().find(e => e.author !== S.slot && !answered(e.id) && fresh(e)) || null;
  const pendingOut = [...inv].reverse().find(e => e.author === S.slot && !answered(e.id) && fresh(e)) || null;
  const yes = [...ans].reverse().find(a => a.payload.yes && now() - a.at < 12 * 36e5);
  const yesInv = yes && inv.find(e => e.id === yes.payload.id);
  const ended = yes && S.events.some(e => e.type === "dateEnd" && e.payload && e.payload.id === yes.payload.id);
  const current = yesInv && !ended ? {kind:yesInv.payload.kind, inviter:yesInv.author, at:yes.at, id:yesInv.id, car:yesInv.payload.car || null} : null;
  const v = {pendingIn, pendingOut, current};
  dsCache = {k:ck, v}; return v;
}

/* ---- Chat ---- */
function chatView(){
  const p = me(), o = partner();
  if (!o) return invitePrompt(p, "Chat se otevře, až přijde druhý syslík");
  if (!S.chat.length) return `<div class="card stack center" style="align-items:center">${syslikSVG(p.look, "wave", 120, {key:"chatempty", wear:wearingOf(p)})}
      <h2 style="font-size:22px">Napište si první zprávu</h2><p class="muted small" style="margin:0">Tenhle chat vidíte jen vy dva. Zkus poslat i samolepku přes 🐿️.</p></div>`;
  let out = "", lastDay = "";
  const oRead = o.chatReadAt || 0;
  const myLast = [...S.chat].reverse().find(m => m.author === S.slot);
  S.chat.forEach(m => {
    const d = fmtDay(m.at);
    if (d !== lastDay) { out += `<span class="day">${esc(d)}</span>`; lastDay = d; }
    const mine = m.author === S.slot;
    const fresh = !mine && m.at > (p.chatReadAt || 0);
    if (m.sticker) {
      const who = S.players[m.author] || {};
      const lbl = m.label || "";
      out += `<div class="msg sticker ${mine ? "me" : ""}">${syslikSVG(m.look || who.look, m.sticker, 96, {key:"st" + m.id.replace(/[^A-Za-z0-9]/g, ""), flip:mine, wear:m.wearing || wearingOf(who)})}<b>${esc(lbl)}</b><small>${fmtTime(m.at)}</small></div>`;
    } else {
      out += `<div class="msg ${mine ? "me" : ""} ${fresh ? "new" : ""}">${esc(m.text)}<small>${fmtTime(m.at)}</small></div>`;
    }
    if (myLast && m.id === myLast.id && oRead >= m.at) out += `<span class="seen">Přečteno ✓</span>`;
  });
  if (S.typing) out += `<span class="typing">${esc(o.name)} píše<i></i><i></i><i></i></span>`;
  return `<div class="stack" style="gap:10px">${out}</div>`;
}
function renderStickers(){
  const box = $("#stickers"); box.hidden = !S.stickers;

function exportMemory(id){

    case "tlSave": {
      const d = S.sheet.draft, editId = S.sheet.editId;
      const item = {id:editId || ("c-" + uid()), type:d.type, color:d.color, pattern:CLOTH[d.type].pat ? (d.pattern || "none") : "none", name:(d.name || "").trim() || CLOTH[d.type].name,
        color2:d.color2 || null, patch:PATCHABLE.has(d.type) ? (d.patch || "none") : "none", letter:(me().name || "")[0] || ""};
      updateMe(pp => {
        pp.wardrobe = (pp.wardrobe || []).filter(x => x.id !== item.id).concat([item]).slice(-80);
        const slot = CLOTH[item.type].slot;
        pp.wearing = wearingOf(pp).filter(x => x.id !== item.id && CLOTH[x.type].slot !== slot).concat([item]);
        pp.look.accessory = "none";
      }, true);
      care("dress"); openSheet("wardrobe"); say(ph.dressed()); homePose("happy", 2000); burst("✂️");
      toast(editId ? "Upraveno ✨" : `Ušito: ${item.name} ${CLOTH[item.type].e}`);
      break;
    }
    case "giveCloth": {
      const it = wardrobe().find(x => x.id === el.dataset.id), o = partner(); if (!it || !o) break;
      send("clothGift", {item:plainItem(Object.assign({}, it, {id:"g-" + uid()}))});
      care("together"); openSheet("wardrobe"); burst("🎁"); toast(`Posláno! ${o.name} to najde ve svém šatníku 🎁`);
      break;
    }
    case "askDelCloth": S.sheet.confirm = true; renderSheet(); break;
    case "delCloth": {
      const id = el.dataset.id;
      updateMe(pp => {
        if (id.startsWith("ev-")) pp.removed = (pp.removed || []).concat([id]).slice(-300);
        else pp.wardrobe = (pp.wardrobe || []).filter(x => x.id !== id);
        pp.wearing = wearingOf(pp).filter(x => x.id !== id);
      });
      openSheet("wardrobe"); toast("Smazáno ze šatníku"); break;
    }

    /* cestování */
    case "travelTo": openSheet("travel", {place:v}); break;
    case "trAct": S.sheet.act = v; S.sheet.dist = ""; renderSheet(); break;
    case "trCar": S.sheet.car = v || null; renderSheet(); break;
    case "trJet": S.sheet.jet = v; renderSheet(); break;
    case "reactions": if (partner()) openSheet("reactions"); break;
    case "react": {
      const r = REACTIONS[Number(v)]; if (!r || !partner()) break;
      send("reaction", {text:r[0], pose:r[1], e:r[2]}); closeSheet(); care("together");
      if (S.tab === "park") parkPlay(r[1], "happy", false, r[2], r[0], 3500); else { homePose(r[1], 2200); say(r[0], 3000); burst(r[2], "#home-scene"); }
      toast(`Řekl(a) jsi: „${r[0]}“ ${r[2]}`); break;
    }
    case "dateFlowers": openSheet("bouquet", {date:true, d:{flowers:{rose:5, tulip:2, sunflower:0, peony:3, daisy:0, lavender:0}, wrap:"#F9CFE0", ribbon:"#E8546B", card:"Pro tebe"}}); break;
    case "dateMug": openSheet("mug", {date:true, d:{color:"#FFFFFF", color2:"#E8546B", pattern:"hearts", motif:"heart", text:""}}); break;
    case "openMug": openSheet("mug", {d:{color:"#FFFFFF", color2:"#E8546B", pattern:"none", motif:"heart", text:""}}); break;
    case "theatreFlowers": openSheet("bouquet", {theatre:true, d:{flowers:{rose:7, tulip:0, sunflower:0, peony:3, daisy:0, lavender:0}, wrap:"#FFFFFF", ribbon:"#E8546B", card:"Brava!"}}); break;
    case "openBouquet": openSheet("bouquet", {d:{flowers:{rose:3, tulip:0, sunflower:0, peony:2, daisy:2, lavender:0}, wrap:"#F7E3B5", ribbon:"#E8546B", card:""}}); break;
    case "openTie": openSheet("tie", {color:"#F48FA6"}); break;
    case "tieColor": S.sheet.color = v; renderSheet(); break;
    case "tieSend": { const item = {id:"c-" + uid(), type:"scrunchie", color:S.sheet.color, pattern:"none", name:"Gumička do vlasů"}; send("clothGift", {item}); closeSheet(); toast("Gumička je na cestě 🎀"); homePose("happy", 1500); break; }
    case "openBeads": openSheet("beads", {d:{beads:[], shape:"round"}}); break;
    case "mugSet": S.sheet.d[el.dataset.k] = v; renderSheet(); break;
    case "bqSet": S.sheet.d[el.dataset.k] = v; renderSheet(); break;
    case "flPlus": { const d = S.sheet.d, t = Object.values(d.flowers).reduce((a, b) => a + b, 0); if (t >= 15) { toast("Víc se do kytice nevejde 💐"); break; } d.flowers[v] = (d.flowers[v] || 0) + 1; renderSheet(); break; }
    case "flMinus": { const d = S.sheet.d; d.flowers[v] = Math.max(0, (d.flowers[v] || 0) - 1); renderSheet(); break; }
    case "bdShape": S.sheet.d.shape = v; renderSheet(); break;
    case "bdAdd": { const d = S.sheet.d; if (d.beads.length >= 24) { toast("Šňůrka je plná 📿"); break; } d.beads.push({c:v, s:d.shape}); renderSheet(); break; }
    case "bdUndo": S.sheet.d.beads.pop(); renderSheet(); break;
    case "bdRandom": { const d = S.sheet.d; d.beads = Array.from({length:12}, () => ({c:pick(BEAD_COLORS), s:pick(Object.keys(BEAD_SHAPES))})); renderSheet(); break; }
    case "bdWear": case "bdSend": {
      const d = S.sheet.d; if (!d.beads.length) break;
      const item = {id:"c-" + uid(), type:"beads", color:d.beads[0].c, pattern:"none", beads:d.beads.slice(0, 24), name:"Navlékané korálky"};
      if (a === "bdWear") { updateMe(pp => { pp.wardrobe = (pp.wardrobe || []).concat([item]).slice(-80); pp.wearing = wearingOf(pp).filter(x => CLOTH[x.type].slot !== "neck").concat([item]); }); toast("Korálky ti moc sluší 📿✨"); }
      else { send("clothGift", {item}); toast("Korálky jsou na cestě 🎁"); }
      closeSheet(); homePose("happy", 1800); break;
    }
    case "craftSend": case "craftKeep": {
      const sh = S.sheet, kind = v; if (!sh || !sh.d) break;
      const to = a === "craftSend" && partner() ? other(S.slot) : S.slot;
      send("craft", Object.assign({kind, design:clone(sh.d), to, theatre:!!sh.theatre}, sh.date ? {date:true} : {})); closeSheet();
      if (sh.date) { setTimeout(() => { say(kind === "mug" ? "Tenhle hrneček je pro tebe ☕💞" : "Tahle kytička je pro tebe 💐💞", 3200); burst(kind === "mug" ? "☕" : "💐", "#home-scene"); }, 200); }
      if (sh.theatre) { setTimeout(() => { homePose("love", 2600); say(`Brava! Tohle je pro tebe 💐`, 3200); burst("💐", "#home-scene"); }, 200); }
      toast(kind === "mug" ? (to === S.slot ? "Hrneček je v tvé skrýši v Doupěti ☕" : "Hrneček je na cestě ☕") : (sh.theatre ? "Kytice předána na jevišti 💐" : sh.date ? "Kytice předána na rande 💐" : "Kytice je na cestě 💐"));
      burst(kind === "mug" ? "☕" : "💐", "#home-scene"); render(); break;
    }
    case "dryBouquet": { const id = el.dataset.id; updateMe(pp => { pp.decor = (pp.decor || []).filter(x => x.id !== id); pp.dried = Object.assign({}, pp.dried || {}, {[id]:now()}); }); closeSheet(); toast("Kytice se v Doupěti usuší a zachová navždy 🥀"); burst("🥀"); render(); break; }
    case "placeDecor": { const id = el.dataset.id; updateMe(pp => { pp.decor = (pp.decor || []).filter(x => x.id !== id).concat(v ? [{id, place:v}] : []); }); closeSheet(); toast(v ? `Hotovo, teď to zdobí ${PLACES[v].loc} ✨` : "Vráceno do Doupěte 🪺"); render(); break; }
    case "sdDip": { const sh = S.sheet; if (!sh || !sh.cur) break; SPORT_DONE.add(sh.cur.at); send("sportResult", {act:sh.cur.act, place:sh.cur.place, at:sh.cur.at, dist:0, dip:true}); toast("💧 Jen smočený tlapík, i to se počítá"); const nx = sh.next; closeSheet(); if (nx) setTimeout(() => doTravel(...nx), 50); break; }
    case "sdSave": {
      const sh = S.sheet; if (!sh || !sh.cur) break;
      const d = parseFloat(String(sh.dist || "").replace(",", ".")); const sp = SPORT[sh.cur.act];
      if (!(d > 0)) { toast(`Vyplň, kolik jsi ${sp.v[p.gender === "female" ? 1 : 0]} ${sp.e}`); const i = $("#sd-dist"); if (i) i.focus(); break; }
      SPORT_DONE.add(sh.cur.at); send("sportResult", {act:sh.cur.act, place:sh.cur.place, at:sh.cur.at, dist:d}); toast(`🏅 ${sp.v[p.gender === "female" ? 1 : 0].charAt(0).toUpperCase() + sp.v[p.gender === "female" ? 1 : 0].slice(1)} ${fmtDist(d, sp.u)}! Zapsáno do deníku`);
      const nx = sh.next; closeSheet(); if (nx) setTimeout(() => doTravel(...nx), 50); break;
    }
    case "trPlay": S.sheet.play = v; renderSheet(); break;
    case "doTravel": {
      let dist = null;
      doTravel(S.sheet.place, v, el.dataset.t === "1", trOf(S.sheet), S.sheet.place === "theatre" && v !== "practice" ? (S.sheet.play || PLAYS[0]) : null, dist, S.sheet.jet || null); break;
    }
    case "goHome": doTravel("home", "nest", false); break;
    case "couWith": updateMe(pp => { pp.couWith = COU_WITH[v] ? v : "none"; }); S.home.pose = "idle"; burst(COU_WITH[v] ? COU_WITH[v][0] : "📺", "#home-scene"); render(); break;
    case "goListen": doTravel("home", "listen", false); break;
    case "bedding": { const pl = locationOf(S.slot).place; openSheet("bedding", {place:pl, bed:bedding(pl)}); break; }
    case "bedSet": S.sheet.bed[el.dataset.k] = v; renderSheet(); break;
    case "bedReset": S.sheet.bed = Object.assign({}, BED_DEF); renderSheet(); break;
    case "bedSave": { send("bedding", {place:S.sheet.place, bed:clone(S.sheet.bed)}); closeSheet(); toast("Pelíšek je převlečený 🛏️✨"); burst("✨", "#home-scene"); render(); break; }
    case "plushTake": { const a0 = S.sheet.plush || []; S.sheet.plush = a0.includes(v) ? a0.filter(x => x !== v) : a0.concat([v]); renderSheet(); break; }
    case "plushInfo": { const P0 = PLUSH[v]; if (P0) toast(`${P0.e} ${P0.n}: ${P0.d}`); break; }
    case "changeAct": { const l = locationOf(S.slot); if (l.date) { toast("Jste spolu na rande 💞"); break; } openSheet("travel", {place:l.place, act:l.act, change:true, play:l.play || null}); break; }

    /* chat */
    case "toggleStickers": S.stickers = !S.stickers; render(); break;
    case "sendChat": {
      const t = $("#chat-input"), text = t.value.trim(); if (!text) return;
      B.addChat({author:S.slot, text:text.slice(0, 500), at:now()});
      t.value = ""; t.style.height = "auto"; $("#chat-send").disabled = true; B.setTyping(false);
      care("message"); t.focus(); scrollChat(); break;
    }
    case "sendSticker": {
      const [pose, label] = STICKERS[Number(v)];
      B.addChat({author:S.slot, sticker:pose, label:pose === "love" ? ph.love() : label, look:clone(p.look), wearing:clone(wearingOf(p)), at:now()});
      S.stickers = false; care("message"); render(); scrollChat(); break;
    }

    /* schovávaná */
    case "hsTap": {
      const s = S.sheet; if (s.found) break; const i = Number(v);
      if (i === s.spot) { s.found = true; s.msg = ph.found(); renderSheet(); burst("🎉"); }
      else { s.wrong++; s.msg = ph.hint(s.wrong); s.wig = i; renderSheet(); setTimeout(() => { if (S.sheet && S.sheet.kind === "hide") { S.sheet.wig = null; } }, 400); }
      break;
    }
    case "hsAgain": Object.assign(S.sheet, {spot:Math.floor(Math.random()*4), found:false, wrong:0, wig:null, msg:"Schovávám se… najdi mě! 🙈"}); renderSheet(); break;
    case "hsDone": closeSheet(); care("play"); homePose("happy", 2000); say("To byla zábava! Zase někdy? 🙈"); maybeFind(0.4); break;

    /* park */
    case "visit": send("visit"); care("together"); parkPlay("wave", "happy", true, "🏡", "Jdu k tobě na návštěvu! 🏡"); maybeFind(0.3); break;
    case "cuddle": send("cuddle"); care("together"); parkPlay("cuddle-r", "cuddle-l", true, "🐿️", "Syslííííímeee, Syslííííímeee! 💞", 4500); maybeFind(0.25); break;
    case "giftPartner": openSheet("giftPartner"); break;
    case "doGiftPartner": closeSheet(); send("gift", {gift:v}); care("together"); parkPlay("happy", "happy", false, CAT.gift[v][1], `Posílám ${CAT.gift[v][2]} ${CAT.gift[v][1]}`); break;
    case "picnic": openSheet("picnic", {place:"meadow", foods:["strawberry","seeds"]}); break;
    case "pkPlace": S.sheet.place = v; renderSheet(); break;
    case "pkFood": { const f = S.sheet.foods; S.sheet.foods = f.includes(v) ? f.filter(x => x !== v) : f.concat([v]); renderSheet(); break; }
    case "doPicnic": { const place = S.sheet.place, foods = Object.keys(CAT.food).filter(k => S.sheet.foods.includes(k)); closeSheet(); send("picnic", {habitat:place, foods}); care("together"); care("feed"); startPicnic(place, foods); break; }
    case "dailyMood": openSheet("mood", {emoji:"😊", text:""}); break;
    case "mdEmoji": S.sheet.emoji = v; renderSheet(); break;
    case "doMood": { const emoji = S.sheet.emoji, text = (S.sheet.text || "").trim(); closeSheet(); send("mood", {emoji, text}); parkPlay("happy", null, false, emoji, null, 2500); break; }
    case "dance": care("play"); parkPlay("dance", "dance", false, "🎶", "Hop, hop, hop! 🎶", 5000); break;
    case "goodnight": send("goodnight"); parkPlay("sleep", "sleep", true, "🌙", "Dobrou noc, spinkej sladce 🌙", 6500); break;
    case "goodmorning": send("goodmorning"); parkPlay("dance", "dance", false, "☀️", "Dobré ráno! Protáhneme se? ☀️", 4500); break;

    /* vzpomínky */
    case "memory": openSheet("memory", {id:el.dataset.id}); break;
    case "export": exportMemory(el.dataset.id); break;

    /* doupě */
    case "place": {
      const item = inventory().find(i => i.id === el.dataset.id); if (!item) break;
      updateMe(pp => {
        if (item.id.startsWith("ev-")) pp.used = (pp.used || []).concat([item.id]).slice(-500);
        else pp.found = (pp.found || []).filter(f => f.id !== item.id);
      });
      const id = uid();
      B.setDen(id, {gift:item.gift, by:p.name, x:+(0.14 + Math.random()*0.72).toFixed(3), y:+(0.5 + Math.random()*0.36).toFixed(3), at:now()});
      send("denPlace", {gift:item.gift});
      burst(CAT.gift[item.gift][1], "#den-scene"); break;
    }
    case "denItem": openSheet("denItem", {id:el.dataset.id}); break;
    case "treasure": openSheet("treasure", {id:el.dataset.id}); break;
    case "denMine": { const st = document.getElementById("my-stash"); if (st) st.scrollIntoView({behavior:"smooth", block:"start"}); break; }
    case "denLocked": toast("Tahle skrýš je soukromá 🤫🔒"); break;
    case "denRemove": {
      const d = S.den.find(x => x.id === el.dataset.id); closeSheet(); if (!d) break;
      B.delDen(d.id);
      updateMe(pp => { pp.found = (pp.found || []).concat([{id:uid(), gift:d.gift, at:now()}]).slice(-200); });
      toast(`${(CAT.gift[d.gift] || ["",""])[1]} je zpátky v košíčku`); break;
    }

    /* nastavení */
    case "setGender": S.sheet.gender = v; renderSheet(); break;
    case "saveLook": {
      const s = S.sheet; if (!s.name.trim()) return;
      updateMe(pp => { if (!Array.isArray(pp.wearing)) pp.wearing = wearingOf(pp); pp.name = s.name.trim().slice(0, 24); pp.gender = s.gender; pp.look = Object.assign(clone(s.look), {accessory:"none"}); if (s.trait) pp.trait = s.trait; if (s.fav) pp.fav = s.fav; }, true);
      closeSheet(); toast(`${me().name} má nový look! ✨`); homePose("happy", 2000); break;
    }
    case "forget": ls.del("syslik.slot"); S.slot = null; closeSheet(); render(); break;
  }
}
function wakeQuiet(){
  const p = me();
  if (p.isSleeping || S.home.pose === "sleep") { updateMe(pp => { pp.isSleeping = false; }); S.home.pose = "idle"; }
}
function wakeUp(){
  updateMe(pp => { pp.isSleeping = false; });
  care("wake"); say(P(me().gender).wake()); homePose("yawn");
  clearTimeout(homeT); homeT = setTimeout(() => homePose("happy", 1800), 1200);
}
function finishOnboarding(){
  const o = S.ob; const name = o.name.trim().slice(0, 24); if (!name) return;
  const slot = S.mode === "local" ? "a" : (!S.players.a ? "a" : !S.players.b ? "b" : null);
  if (!slot) { toast("Oba syslíci už existují. Vyber, kdo jsi."); S.ob = null; render(); return; }
  S.slot = slot; ls.set("syslik.slot", slot); ls.set("syslik.version", String(APP_VERSION));
  S.players[slot] = Object.assign(newPlayer(name, o.gender, o.look), {trait:"cuddly", fav:"strawberry"});
  ls.set("syslik.seen." + slot, String(now()));
  S.ob = null;
  B.savePlayer(true); B.announce();
  S.tab = partner() ? "park" : "home";
  render();
  setTimeout(() => { if (partner()) { parkPlay("cuddle-r", "cuddle-l", true, "💞", "Konečně se potkáváme! 💞", 4500); } else { homePose("happy", 2200); say(`Ahoj, já jsem ${name}! 🐾`); } }, 400);
}

/* ============ Start ============ */
function greet(){
  const p = me(); if (!p) return;
  const dl = applyReactions(); if (dl) setTimeout(() => floatText(dl > 0 ? `+${dl} % nálady od ${partner().name} 😊` : `${dl} % nálady 😒`), 1600);
  const key = "syslik.seen." + S.slot;
  const last = Number(ls.get(key) || p.lastSeenAt || now());
  const h = (now() - last) / 36e5;
  ls.set(key, String(now()));
  const act = idleActivity(p);
  if (act === "sleeping") { if (h >= 2) say("Zzz… (klepni na mě, až mě budeš chtít vzbudit)", 4000); }
  else if (h >= 2) { homePose("happy", 2200); say(P(p.gender).welcome(h)); setTimeout(() => burst("💛", "#home-scene"), 300); }
  updateMe(pp => { pp.lastSeenAt = now(); if (!Array.isArray(pp.wearing)) { pp.wearing = wearingOf(pp); pp.look.accessory = "none"; } if (!pp.chatReadAt) pp.chatReadAt = now(); });
  const seenV = Number(ls.get("syslik.version") || 0);
  if (seenV < APP_VERSION) { ls.set("syslik.version", String(APP_VERSION)); setTimeout(() => openSheet("news"), 1200); }
}
function boot(){
  if (S.booted) return;
  S.booted = true;
  if (S.slot && !S.players[S.slot]) { S.slot = null; ls.del("syslik.slot"); }
  render();
  if (me()) setTimeout(greet, 400);
}
$("#boot-sy").innerHTML = syslikSVG(DEFAULT_LOOK, "sleep", 150, {key:"boot"});
B.init();
setInterval(() => { if (S.booted && !document.hidden) render(); }, 60000);
document.addEventListener("visibilitychange", () => { document.documentElement.classList.toggle("paused", document.hidden); if (!document.hidden && S.booted) render(); });
</script>

</body>
</html>
